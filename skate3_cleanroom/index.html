<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="skate.">
<link rel="manifest" href="manifest.webmanifest">
<title>skate. — Fan Game</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --fg: #e8e8e8;
    --muted: #8a9aab;
    --accent: #3ec6ff;
    --panel: #111;
  }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; inset: 0; }
  #bevy { width: 100%; height: 100%; display: block; outline: none; }

  /* Unified PLATODOOM arcade spray-paint boot overlay */
  #spray-paint-loader-overlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: opacity 0.35s ease;
  }
  #spray-paint-loader-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  #spray-paint-credit-subtitle {
    position: fixed;
    left: 50%;
    top: 82%;
    transform: translateX(-50%);
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(11px, 1.15vw, 15px);
    font-weight: 600;
    letter-spacing: 0.16em;
    color: rgba(218, 198, 192, 0.86);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    z-index: 100000;
  }
  #status {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--muted);
    font-size: 13px;
    white-space: pre-wrap;
    text-align: center;
    max-width: min(560px, 92vw);
    z-index: 100001;
    display: none;
  }
  #status.error {
    display: block;
    color: #ff7b72;
    background: rgba(17, 17, 17, 0.92);
    border: 1px solid #442222;
    border-radius: 6px;
    padding: 10px 14px;
  }
  #progress { display: none; }

  #mapbar {
    position: fixed; bottom: 8px; right: 8px; z-index: 3;
    display: none; gap: 6px; align-items: center;
    background: #0b0b0bcc; padding: 4px 8px; border-radius: 6px; font-size: 12px;
  }
  #mapbar.visible { display: flex; }
  button {
    background: #1a1a1a; color: var(--fg); border: 1px solid #333; border-radius: 4px;
    padding: 2px 8px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  :fullscreen #mapbar { opacity: 0; transition: opacity .3s; }
  :fullscreen #mapbar:hover { opacity: 1; }
  #mapcredit { color: var(--muted); text-decoration: none; max-width: 40vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mapcredit[href]:hover { color: var(--accent); }
  select {
    max-width: 60vw; background: #1a1a1a; color: var(--fg);
    border: 1px solid #333; border-radius: 4px; padding: 2px 4px;
  }
  #hint { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5;
    max-width: min(420px, 90vw); background: #0b0b0bee; border: 1px solid #2a2a2a;
    border-radius: 8px; padding: 14px 16px; display: none; }
</style>
</head>
<body>
<div id="game"><canvas id="bevy" tabindex="0"></canvas></div>

<div id="spray-paint-loader-overlay">
  <canvas id="spray-paint-loader-canvas" aria-label="Spray paint loading screen"></canvas>
  <div id="spray-paint-credit-subtitle">Decompilation Credit: AndrewNakas</div>
  <div id="status"></div>
  <div id="progress"></div>
</div>

<div id="mapbar">
  <button id="return-alley-btn" type="button" title="Return to Freeman Alley 3D Portfolio" onclick="window.location.assign('../')">← 3D Portfolio (Alley)</button>
  <a id="mapcredit" target="_blank" rel="noopener" hidden></a>
  <label for="char">Skater</label>
  <select id="char">
    <option value="luis" selected>Luis</option>
    <option value="luis_holo">Luis + Hologram</option>
  </select>
  <label for="map">Map</label><select id="map"></select><input id="mapfile" type="file" accept=".skate" hidden>
  <button id="fullscreen" type="button" title="Fullscreen (F11 also works)">Fullscreen</button></div>
<div id="hint"></div>

<script type="module" src="./loader.js"></script>
<script type="module" src="./touch.js"></script>
</body>
</html>
