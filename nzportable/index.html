<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#09090b">
<title>Nazi Zombies: Portable — FTEQW WebGL</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --fg: #e8e8e8;
    --muted: #9ca3af;
    --accent: #f59e0b;
    --accent-crimson: #dc2626;
    --panel: #111113;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game {
    position: fixed;
    inset: 0;
    margin: 0;
    padding: 0;
  }
  /* The canvas MUST NOT have any border or padding, or FTEQW mouse/PointerLock coordinates will be offset */
  canvas.emscripten, #canvas {
    border: 0px none;
    width: 100%;
    height: 100%;
    padding: 0;
    margin: 0;
    display: block;
    outline: none;
    background-color: #000000;
  }

  /* Unified PLATODOOM arcade spray-paint boot overlay */
  #spray-paint-loader-overlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: #000000;
    z-index: 99999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: opacity 0.35s ease;
  }
  #spray-paint-loader-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  #spray-paint-credit-subtitle {
    position: fixed;
    left: 50%;
    top: 82%;
    transform: translateX(-50%);
    font-family: 'Courier New', Courier, monospace;
    font-size: clamp(11px, 1.15vw, 15px);
    font-weight: 600;
    letter-spacing: 0.16em;
    color: rgba(218, 198, 192, 0.86);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.95);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    z-index: 100000;
  }
  #status {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--muted);
    font-size: 13px;
    white-space: pre-wrap;
    text-align: center;
    max-width: min(560px, 92vw);
    z-index: 100001;
    display: none;
  }
  #status.error {
    display: block;
    color: #ff7b72;
    background: rgba(17, 17, 21, 0.94);
    border: 1px solid #442222;
    border-radius: 6px;
    padding: 10px 14px;
  }
  #progress, #mb-counter, #overlay-return-alley {
    display: none;
  }

  /* Bottom-right non-intrusive HUD bar */
  #hudbar {
    position: fixed;
    bottom: 8px;
    right: 8px;
    z-index: 3;
    display: none;
    gap: 6px;
    align-items: center;
    background: rgba(11, 11, 13, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.14);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 12px;
    backdrop-filter: blur(6px);
  }
  #hudbar.visible {
    display: flex;
  }
  #hudbar button {
    background: #18181b;
    color: var(--fg);
    border: 1px solid #3f3f46;
    border-radius: 4px;
    padding: 3px 9px;
    cursor: pointer;
    font: inherit;
  }
  #hudbar button:hover {
    border-color: var(--accent);
    color: #ffffff;
  }
  :fullscreen #hudbar {
    opacity: 0.25;
    transition: opacity 0.25s;
  }
  :fullscreen #hudbar:hover {
    opacity: 1;
  }
</style>
</head>
<body>
<div id="game">
  <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
</div>

<div id="spray-paint-loader-overlay">
  <canvas id="spray-paint-loader-canvas" aria-label="Spray paint loading screen"></canvas>
  <div id="spray-paint-credit-subtitle">Decompilation Credit: NZPTeam</div>
  <div id="status"></div>
  <div id="progress"></div>
  <div id="mb-counter"></div>
  <a id="overlay-return-alley" href="../">&larr; Return to 3D Alley Portfolio</a>
</div>

<div id="hudbar">
  <button id="return-alley-btn" type="button" title="Return to Freeman Alley 3D Portfolio" onclick="window.location.assign('../')">&larr; 3D Portfolio (Alley)</button>
  <button id="fullscreen" type="button" title="Toggle Fullscreen (F11)">Fullscreen</button>
</div>

<script type="module" src="./loader.js"></script>
</body>
</html>
